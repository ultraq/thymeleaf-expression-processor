plugins {
	id 'idea'
	id 'nz.net.ultraq.gradle.fluent-configuration' version '0.9.3'
}

description = 'A simplified API for working with Thymeleaf expressions'
version = '4.0.0'
group = 'nz.net.ultraq.thymeleaf'

var thymeleafVersion = '3.1.3.RELEASE'

configure {
	createGroovyLibraryProject()
		.useJavaVersion(17)
		.useMavenCentralRepositories()
		.withGroovydocOptions() {
			link("https://www.thymeleaf.org/apidocs/thymeleaf/${thymeleafVersion}/", 'org.thymeleaf.')
		}
		.withJarOptions() {
			manifest {
        attributes('Automatic-Module-Name': 'nz.net.ultraq.thymeleaf.expressionprocessor')
      }
		}
		.withSourcesJar()
		.withGroovydocJar()
		.configureSource()
			.withSourceDirectory('source')
			.withDependencies() {
				api 'org.apache.groovy:groovy:5.0.4'
				implementation "org.thymeleaf:thymeleaf:${thymeleafVersion}"
			}
		.configureVerification()
			.withTestDirectory('test')
			.withTestDependencies() {
				testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
				testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
			}
			.useCodenarc(resources.text.fromUri('https://raw.githubusercontent.com/ultraq/codenarc-config-ultraq/master/codenarc.groovy'))
			.useJUnitJupiter()
			.useJacoco()

	createMavenPublication()
		.withArtifacts(groovydocJar)
		.configurePom() {
			url = 'https://github.com/ultraq/thymeleaf-expression-processor'
			inceptionYear = '2016'
		}
		.useApache20License()
		.withGitHubScm('ultraq')
		.withDevelopers([
			name: 'Emanuel Rabina',
			email: 'emanuelrabina@gmail.com',
			url: 'https://www.ultraq.net.nz'
		])

	createMavenCentralPublisherBundle()
		.forThisProject()
		.withCredentials(
			findProperty('mavenCentral.publisher.username'),
			findProperty('mavenCentral.publisher.password')
		)
}
